<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hrach & Elen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    margin:0;
    background:black;
    font-family:Arial;
}

iframe{
    width:100%;
    height:100vh;
    border:none;
    display:block;
}

#hint{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:14px;
}

</style>
</head>

<body>

<div id="hint">
Tap screen to start music 🎵
</div>

<audio id="bgMusic" loop>
<source src="music.mp3.mp3" type="audio/mpeg">
</audio>

<iframe src="https://www.canva.com/design/DAHCsG1vLdE/0VKJUHNnbsshlg2-UwXUHA/view?embed"
allowfullscreen>
</iframe>

<script>
document.body.addEventListener("click", function(){
    document.getElementById("bgMusic").play();
}, { once:true });
</script>

</body>
</html>
